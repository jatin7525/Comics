name: astra-comics
services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "astra", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - astra-mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (rs.status().ok && db.hello().isWritablePrimary) quit(0); else quit(1); } catch (e) { rs.initiate({_id: \"astra\", members: [{_id: 0, host: \"localhost:27017\"}]}); quit(1); }'"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes:
  astra-mongo:
